name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go run mvdan.cc/gofumpt@v0.12.0 -l . > fmt.txt
          if [ -s fmt.txt ]; then cat fmt.txt; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz
        run: |
          go test -run XXX -fuzz FuzzObserve -fuzztime 20s .
          go test -run XXX -fuzz FuzzNew -fuzztime 10s .
      - name: bench smoke
        run: go test -run XXX -bench . -benchtime 200x .
